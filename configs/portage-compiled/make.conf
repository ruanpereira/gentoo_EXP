# /etc/portage/make.conf
# Configurações do Gentoo Linux (gentoo_EXP) — Modo Compilado Híbrido
# Sistema base compilado nativamente com -march=znver3.
# Pacotes pesados sem valor de recompilação (zen-bin, steam, rust-bin)
# são obtidos via binhost através de exceções em package.env.

# Compiler Flags otimizadas para o Ryzen 5 5600XT (Zen 3)
COMMON_FLAGS="-O2 -pipe -march=znver3 -fstack-protector-strong -D_FORTIFY_SOURCE=3 -Wl,-z,relro -Wl,-z,now"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Paralelismo de Compilação (12 threads do Ryzen 5 5600XT)
MAKEOPTS="-j12"

# Driver de Vídeo Dedicado para AMD Radeon RX 6600 (Navi 23 / RDNA 2)
VIDEO_CARDS="amdgpu radeonsi"

# Recursos do Portage: apenas parallel-fetch; sem getbinpkg global.
# Pacotes binários são definidos individualmente via /etc/portage/package.env/binpkg.
FEATURES="parallel-fetch"

# Licenças: Base livre/redistribuível, com permissões para software proprietário
ACCEPT_LICENSE="* -@EULA"

# USE Flags globais sem perfil desktop/server pré-fixado
USE="elogind udev dbus btrfs audit seccomp caps -systemd"

# Configuração de Plataforma GRUB
GRUB_PLATFORMS="efi-64"

# Idioma da saída do sistema
LC_MESSAGES=C.utf8
