# /etc/portage/env/binpkg.conf
# Ambiente de exceção: força o Portage a usar o binhost para pacotes
# listados em package.env/binpkg, mesmo com getbinpkg desativado globalmente.
# Usado para pacotes que não têm valor de recompilação nativa:
#   zen-bin, steam-launcher, rust-bin.

FEATURES="getbinpkg binpkg-request-signature"
BINHOST="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/"
PORTAGE_BINHOST="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/"
