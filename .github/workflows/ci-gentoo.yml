name: Gentoo CI - Validação Binária & Regras

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-scripts:
    name: Validação de Sintaxe dos Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7

      - name: Verificar Sintaxe dos Scripts Shell
        run: |
          for script in configs/scripts/*.sh; do
            bash -n "$script" || exit 1
            echo "✓ $script: sintaxe válida"
          done

  validate-binary-install:
    name: Validação Portage e Binhost x86-64-v3
    runs-on: ubuntu-latest
    needs: validate-scripts
    container:
      image: gentoo/stage3:latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7

      - name: Sincronização do Snapshot Portage
        run: emerge-webrsync

      - name: Aplicar Configurações e Árvore Portage
        run: |
          chmod +x configs/scripts/*.sh
          ./configs/scripts/sync-portage.sh to-system

      - name: Validar Resolução da Esteira Binária
        run: |
          ./configs/scripts/test-configs.sh

  validate-niri-config:
    name: Validação de Configuração do Niri
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7

      - name: Instalar Niri
        run: |
          pacman -Sy --noconfirm niri

      - name: Validar Configuração do Niri
        run: |
          niri validate -c configs/niri/config.kdl
